# Minimal self-contained test environment for hex-ob's mock-tier tests.
#
# Deliberately duplicates hex-profile-collection's ophyd-async pin: CI failing
# when the two drift apart is the version-skew signal we want, not an accident.
# Policy (2026-08-12): track latest ophyd-async until the October user-ready
# date — same pin as hextools ("0.21.1,<0.22"); bump this and the
# hex-profile-collection pin in lockstep. The full profile env (EPICS, Tiled,
# ...) stays in hex-profile-collection/pixi.toml; this env only needs to
# import lib/ + plans/ and drive mock signal backends.

[project]
name = "hex-ob"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.12.*"
pip = "*"

[pypi-dependencies]
ophyd-async = { version = ">=0.21.1,<0.22", extras = ["ca", "pva"] }
bluesky = "*"
numpy = "*"
pytest = "*"
# pyepics: the sim suites' acceptance oracle (legacy-script equivalence checks)
# — lets the *_sim_test.py files run under this env too, not just the mock tier.
pyepics = "*"

[tasks]
test-mock = "python tests/run_mock_tests.py"
